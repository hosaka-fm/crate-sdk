name: Spec staleness

# Tier-2 drift check (NETWORK). Schedule-only + manual — NEVER gates PR CI, so an
# upstream spec change overnight can't turn unrelated PRs red. On drift it REGENERATES
# and opens a PR carrying the re-vendored spec + types (2026-08-04: the issue-only flow
# sat unactioned twice, 07-14→07-26 and 07-26→08-04 — thirteen versions of drift each
# time). The PR body lists the remaining HUMAN steps (semver bump + CHANGELOG). Issue
# creation remains as the fallback when the PR can't be opened.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: check
        run: npm run check:staleness
        continue-on-error: true
      - name: Regenerate on drift
        if: steps.check.outcome == 'failure'
        run: |
          npm run spec:vendor
          npm run generate
      - name: Open regen PR on drift
        id: regen_pr
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/spec-drift-auto-regen
          commit-message: 'chore(spec): auto-regen — upstream openapi.json changed'
          title: 'chore(spec): auto-regen — upstream openapi.json changed'
          labels: spec-drift
          body: |
            Automated regen from the nightly staleness check: the live crate spec drifted from
            the vendored copy. This PR carries the re-vendored `spec/openapi.json` + regenerated
            types + `spec/meta.json` (the offline CI gate enforces byte-equality).

            **Human steps before merge** (judgment, deliberately not automated):
            - [ ] semver bump (`package.json` + `src/index.ts` VERSION) sized to the upstream changes
            - [ ] CHANGELOG entry (the contract test requires one per version)
      - name: Open issue on drift (fallback — PR could not be created)
        if: steps.check.outcome == 'failure' && steps.regen_pr.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Spec drift: crate openapi.json changed upstream';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'spec-drift',
            });
            if (existing.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              labels: ['spec-drift'],
              body: 'The live crate OpenAPI spec differs from the vendored `spec/openapi.json`.\n\nRun `npm run generate` and commit the regenerated types + `spec/meta.json`. The offline drift gate in CI will then enforce byte-equality.',
            });
